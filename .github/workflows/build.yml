name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Adds only the generated files that are not committed (Gradle wrapper, local.properties).
      # Existing project files are never overwritten by `flutter create`.
      - name: Complete Android wrapper files
        run: flutter create --platforms=android --org com.gphotos --project-name gphotos .

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: Gphotos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
