name: gphotos
description: Gphotos - on-device gallery, photo editor, face grouping and encrypted vault.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.4
  image: ^4.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  local_auth: ^2.3.0
  google_mlkit_face_detection: ^0.12.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
